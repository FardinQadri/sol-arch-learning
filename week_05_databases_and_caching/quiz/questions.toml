  "Run a scheduled Lambda function that scans the table and deletes sessions older than a day.",
  "Stream table changes to a Lambda function that deletes each session after a day.",
  "Enable Time to Live on the table using an attribute that holds the expiry time in epoch seconds.",
  "Enable point-in-time recovery with a retention period of one day.",
]
answer = ["C"]
explain = { A = "A scan consumes read capacity and each delete consumes write capacity, and it needs custom code.", B = "The function would need its own scheduling and delete calls, which consume write capacity.", C = "Correct. TTL removes expired items in the background without consuming write throughput; deletion can lag but expired items are simply ignored.", D = "Point-in-time recovery keeps backups for restores and does not delete items from the table." }
ref = "week_05_databases_and_caching/concepts/03_dynamodb.md"

