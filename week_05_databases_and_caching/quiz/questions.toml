kind = "single"
stem = """A company runs a stateless web fleet on EC2 instances behind an Application Load Balancer. Sessions are kept in each instance's memory, so users are signed out when instances terminate. The company needs one shared session store with sub-millisecond reads, where each session expires automatically after 30 idle minutes. Which solution meets these requirements?"""
