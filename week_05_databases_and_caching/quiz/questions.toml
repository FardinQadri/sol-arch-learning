services = ["Amazon Aurora", "Aurora I/O-Optimized"]
kind = "single"
stem = """A company runs a write-heavy Amazon Aurora PostgreSQL cluster on Aurora Standard storage. Charges per million I/O requests are now the largest line on the monthly Aurora bill, and the I/O volume is steady from month to month. The company wants the MOST cost-effective change that needs no application changes. What should it do?"""
options = [
  "Change the cluster's storage configuration to Aurora I/O-Optimized.",
  "Add Aurora Replicas so the I/O is spread across more instances.",
  "Move to Aurora Serverless v2 with a higher minimum capacity.",
  "Move the writer to a larger instance class so more data fits in memory.",
]
answer = ["A"]
explain = { A = "Correct. Aurora I/O-Optimized has no per-request I/O charge, and it is the better value when I/O spending is a large share (25 percent or more) of the total bill.", B = "Replicas add instance cost, and the writer's I/O is still billed per request.", C = "Serverless v2 changes how compute is billed, not the per-request I/O charge.", D = "More memory may reduce some reads but costs more per hour, and the write I/O charges remain." }
ref = "week_05_databases_and_caching/concepts/02_aurora.md"

[[question]]
id = "w05-q15"
domain = 3
task = "3.3"
services = ["Amazon DynamoDB", "On-demand capacity"]
kind = "single"
stem = """A startup is launching a mobile game backend on a new Amazon DynamoDB table. Nobody can predict launch traffic: it could stay quiet for hours and then spike sharply after a social media campaign. The team wants no capacity planning, no throttling from underestimating traffic, and to pay only for requests actually made. Which capacity setting should the team choose?"""
options = [
  "Provisioned capacity with a high fixed number of read and write capacity units.",
  "Provisioned capacity with Application Auto Scaling and a target utilization of 70 percent.",
  "Provisioned capacity with reserved capacity purchased for one year.",
  "On-demand capacity mode.",
]
answer = ["D"]
explain = { A = "Fixed capacity is billed every hour whether it is used or not, and a sharp spike can still exceed it.", B = "Auto scaling reacts after consumption breaches the target, so a sudden spike can throttle before capacity catches up, and it still needs min and max planning.", C = "Reserved capacity is a commitment for steady provisioned usage, the opposite of unpredictable traffic.", D = "Correct. On-demand mode needs no capacity planning, absorbs spikes, and bills per request." }
ref = "week_05_databases_and_caching/concepts/03_dynamodb.md"

[[question]]
