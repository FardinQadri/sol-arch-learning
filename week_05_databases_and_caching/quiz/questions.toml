  "Update the cache whenever the database record is written.",
  "Add more read replicas to the cache cluster.",
  "Set an expiry time on the cached keys.",
  "Move the cache to a larger node type.",
]
answer = ["B", "D"]
explain = { A = "Multi-AZ failover improves availability and does nothing about stale or unused data.", B = "Correct. Write-through keeps the cache current whenever the database changes.", C = "Replicas add read capacity and still replicate the stale values.", D = "Correct. A TTL expires stale keys and clears out entries nobody reads, so memory is reclaimed.", E = "A larger node holds more data, including stale and unused entries, and fixes neither problem." }
