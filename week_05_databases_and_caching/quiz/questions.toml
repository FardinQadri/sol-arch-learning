domain = 4
task = "4.3"
services = ["Amazon DynamoDB", "Time to Live"]
kind = "single"
stem = """An online retailer stores shopping sessions as items in a DynamoDB table. Each session should disappear about a day after its last activity. The application ignores expired sessions it happens to read, so deletion can lag. The company wants no write-capacity cost for the cleanup and no custom code. Which solution meets these requirements?"""
