[[question]]
id = "w05-q01"
domain = 2
task = "2.2"
services = ["Amazon RDS", "Multi-AZ"]
kind = "single"
stem = """A logistics company runs its order database on a Single-AZ Amazon RDS for MySQL instance. After an Availability Zone disruption the database was unavailable for hours. The company wants the database to fail over to another Availability Zone automatically, keep the same endpoint name, and need no application code changes. Read scaling is not needed. Which solution meets these requirements with the LEAST change?"""
options = [
  "Create a read replica in a second Availability Zone and promote it by hand after an outage.",
  "Modify the DB instance to use a Multi-AZ DB instance deployment.",
  "Take a manual snapshot every hour and restore the newest one in another Availability Zone after an outage.",
  "Put an RDS Proxy in front of the existing Single-AZ DB instance.",
]
answer = ["B"]
explain = { A = "Promotion is manual, replication is asynchronous, and the promoted replica has its own endpoint, so the application would have to change.", B = "Correct. A Multi-AZ DB instance deployment keeps a synchronous standby in another AZ and flips the DNS name of the same endpoint on failure, with no code changes.", C = "A restore creates a new instance with a new endpoint, takes a long time, and loses up to an hour of data.", D = "A proxy pools connections but there is still only one database instance behind it, so an AZ failure still takes the database down." }
ref = "week_05_databases_and_caching/concepts/01_rds.md"

[[question]]
id = "w05-q02"
domain = 2
task = "2.2"
services = ["Amazon RDS", "Read replicas"]
kind = "single"
stem = """An e-commerce company runs Amazon RDS for PostgreSQL in a Multi-AZ DB instance deployment. Analysts run long reporting queries against it during business hours, and checkout latency rises. The reports can use data that is a few seconds old. The company wants to move the reporting load off the primary instance without changing the schema or the checkout application. Which solution meets these requirements?"""
options = [
  "Point the reporting tool at the standby instance of the Multi-AZ deployment.",
  "Add an RDS Proxy and route the reporting sessions through it.",
  "Create a read replica and point the reporting tool at the replica's endpoint.",
  "Move the DB instance to a larger memory optimized instance class.",
]
answer = ["C"]
explain = { A = "The standby of a Multi-AZ DB instance deployment cannot serve read traffic.", B = "A proxy shares connections, but every query still runs on the primary instance.", C = "Correct. A read replica is an asynchronous copy that serves read-only queries, so the reports no longer compete with checkout.", D = "A bigger instance still runs reports and checkout on the same database, so they keep competing and the bill rises." }
ref = "week_05_databases_and_caching/concepts/01_rds.md"

[[question]]
id = "w05-q03"
domain = 2
task = "2.2"
services = ["Amazon RDS", "Cross-Region read replicas"]
kind = "single"
stem = """A media company runs Amazon RDS for MySQL in us-east-1. Its disaster recovery plan needs a continuously updated copy of the data in eu-west-1, and the team accepts promoting that copy by hand during a Regional outage. The company wants to keep using RDS for MySQL rather than migrate to Aurora. Which solution meets these requirements?"""
options = [
  "Create a cross-Region read replica in eu-west-1 and promote it if us-east-1 fails.",
  "Enable Multi-AZ on the DB instance and choose a subnet in eu-west-1 for the standby.",
  "Copy a manual snapshot to eu-west-1 once a week and restore it if us-east-1 fails.",
  "Create a read replica in another Availability Zone of us-east-1 and promote it if the Region fails.",
]
answer = ["A"]
explain = { A = "Correct. A cross-Region read replica receives asynchronous replication continuously and can be promoted to a standalone writable instance in the other Region.", B = "A Multi-AZ standby always lives in the same Region as the primary.", C = "A weekly snapshot copy is not a continuously updated copy; up to a week of data would be lost.", D = "A replica in the same Region goes down with the Region, so it gives no disaster recovery for a Regional outage." }
ref = "week_05_databases_and_caching/concepts/01_rds.md"

[[question]]
id = "w05-q04"
domain = 2
task = "2.2"
services = ["Amazon RDS", "Multi-AZ DB cluster"]
kind = "single"
stem = """A gaming company runs Amazon RDS for PostgreSQL in a Multi-AZ DB instance deployment. The standby cannot serve reads, and failovers take longer than the company would like. The company wants two standby copies in separate Availability Zones that can also serve read queries, with noticeably faster failover, and it wants to stay on RDS for PostgreSQL. Which change meets these requirements?"""
options = [
  "Add two read replicas in other Availability Zones and keep the Multi-AZ DB instance deployment.",
  "Move the database to a larger instance class and keep the Multi-AZ DB instance deployment.",
  "Keep the Multi-AZ DB instance deployment and put RDS Proxy in front of it.",
  "Migrate the database to a Multi-AZ DB cluster deployment.",
]
answer = ["D"]
explain = { A = "Read replicas give readable copies, but they are not automatic failover targets and the instance's failover is no faster.", B = "A larger instance class does not change how failover works or make the standby readable.", C = "A proxy can shorten the time clients take to reconnect, but the standby stays unreadable and there is still only one standby.", D = "Correct. A Multi-AZ DB cluster has a writer and two readable standbys in three AZs, with failover typically under 35 seconds." }
ref = "week_05_databases_and_caching/concepts/01_rds.md"

[[question]]
id = "w05-q05"
domain = 2
task = "2.2"
services = ["Amazon RDS", "AWS KMS", "Snapshots"]
kind = "single"
stem = """A compliance audit finds that a production Amazon RDS for MySQL database was created without encryption at rest. The company must encrypt it with an AWS KMS key and can accept a short cutover window. Which approach should the architect use?"""
options = [
  "Modify the DB instance to turn on encryption at rest with a KMS key during the next maintenance window.",
  "Take a snapshot, copy it with encryption enabled under a KMS key, and restore a new DB instance from the copy.",
  "Create a read replica with encryption enabled in the console, then promote it to a standalone instance.",
  "Turn on encryption in the DB parameter group and reboot the instance to apply the new setting.",
]
answer = ["B"]
explain = { A = "Encryption at rest can only be chosen when a DB instance is created; a modify action cannot enable it.", B = "Correct. An unencrypted snapshot can be copied with encryption turned on, and restoring that copy gives an encrypted DB instance.", C = "An encrypted read replica cannot be created from an unencrypted source instance.", D = "Encryption is not a parameter group setting, so a reboot changes nothing." }
ref = "week_05_databases_and_caching/concepts/01_rds.md"

[[question]]
id = "w05-q06"
domain = 2
task = "2.2"
services = ["Amazon RDS", "Automated backups", "Point-in-time restore"]
kind = "single"
stem = """At 14:20 a developer ran an UPDATE without a WHERE clause on the orders table of a production Amazon RDS for PostgreSQL database that has automated backups enabled with 7-day retention. The mistake was found at 14:30. The company wants the data as it was just before 14:20 and wants the current instance left running while the team recovers the affected rows. Which action should the architect take?"""
options = [
  "Restore the database to 14:19 with point-in-time recovery.",
  "Restore the most recent daily automated snapshot.",
  "Reboot the DB instance with failover to the standby.",
  "Use Backtrack to rewind the database to 14:19.",
]
answer = ["A"]
explain = { A = "Correct. Point-in-time recovery always restores to a new DB instance, so the original keeps running while the affected rows are copied back.", B = "The daily snapshot loses all changes made since it was taken, and a restore never overwrites the existing instance.", C = "The standby is synchronous, so it already contains the bad UPDATE.", D = "Backtrack exists only for Aurora MySQL, not for RDS for PostgreSQL." }
ref = "week_05_databases_and_caching/concepts/01_rds.md"

[[question]]
id = "w05-q07"
domain = 1
task = "1.3"
services = ["Amazon RDS", "AWS Secrets Manager", "AWS IAM"]
kind = "single"
stem = """A healthtech company is creating a new Amazon RDS for PostgreSQL database. Security policy forbids database passwords and long-term access keys in application code or configuration files, requires the master password to rotate automatically, and asks for the least operational work. Which solution meets these requirements?"""
options = [
  "Store the password in a Secrets Manager secret and rotate it with a Lambda function the team writes and maintains.",
  "Store the password as a Parameter Store SecureString parameter and change it with a scheduled script.",
  "Pass the password as a NoEcho CloudFormation parameter and change it each quarter.",
  "Create the DB instance with RDS-managed master user credentials in Secrets Manager.",
]
answer = ["D"]
explain = { A = "This works, but the team owns and maintains the rotation code, which is more operational work than the managed option.", B = "A SecureString protects storage, but rotation depends on a script the team must write, run and keep in sync with the database.", C = "NoEcho only hides the value in the console; the password is still supplied by hand and rotated manually.", D = "Correct. RDS generates the master password, stores it in Secrets Manager and rotates it on a schedule, and applications read it through their IAM role." }
ref = "week_05_databases_and_caching/concepts/01_rds.md"

[[question]]
id = "w05-q08"
domain = 3
task = "3.3"
services = ["RDS Proxy", "AWS Lambda", "Amazon RDS"]
kind = "single"
stem = """A company runs a Lambda-based API that writes to an Amazon RDS for MySQL database. During traffic bursts, thousands of concurrent function instances each open their own connection, and the database reports too many connections while its CPU stays low. The database instance size must stay the same to control cost, and code changes must be minimal. Which solution should the architect implement?"""
options = [
  "Add a read replica and send half of the function connections to it.",
  "Convert the DB instance to a Multi-AZ DB instance deployment.",
  "Create an RDS Proxy for the database and have the functions connect to the proxy endpoint.",
  "Move the database to a larger memory optimized instance class to raise the connection limit.",
]
answer = ["C"]
explain = { A = "A replica accepts only reads, and the writes would still open too many connections on the primary.", B = "A standby does not serve connections, so the primary's connection limit is unchanged.", C = "Correct. RDS Proxy pools and shares database connections, so a burst of Lambda invocations no longer exhausts the database's connection limit.", D = "A larger class raises the limit, but it breaks the requirement to keep the instance size and costs more." }
ref = "week_05_databases_and_caching/concepts/01_rds.md"

[[question]]
id = "w05-q09"
domain = 3
task = "3.3"
services = ["Amazon RDS", "Deletion protection", "Snapshots"]
kind = "multi"
choose = 2
stem = """A company's production Amazon RDS for MySQL database was deleted by mistake during a cleanup of a test account. The company wants to prevent a repeat: a delete request must be refused unless someone first turns off a safeguard on purpose, and if the instance is ever deleted a restorable copy of its data must remain. Which combination of steps meets these requirements? (Select TWO.)"""
options = [
  "Raise the automated backup retention period to the maximum.",
  "Convert the DB instance to a Multi-AZ DB instance deployment.",
  "Turn on deletion protection for the DB instance.",
  "Turn on Enhanced Monitoring for the DB instance.",
  "Take a final DB snapshot whenever the instance is deleted.",
]
answer = ["C", "E"]
explain = { A = "Automated backups are removed together with the instance unless they are retained separately, and a longer retention does not stop the delete.", B = "The standby is deleted along with the primary, so Multi-AZ gives no protection against deletion.", C = "Correct. With deletion protection on, delete requests fail until the setting is turned off.", D = "Enhanced Monitoring shows operating system metrics and has no effect on deletion.", E = "Correct. A final snapshot is kept after the instance is deleted, so the data can be restored." }
ref = "week_05_databases_and_caching/concepts/01_rds.md"

[[question]]
id = "w05-q10"
domain = 3
task = "3.3"
services = ["Amazon Aurora", "Aurora Replicas"]
kind = "single"
stem = """A SaaS company runs a MySQL-compatible Amazon Aurora cluster with a single writer instance. A new dashboard feature has pushed read traffic until the writer is saturated. The dashboard can tolerate slightly stale data. The company wants to scale reads without the application keeping a list of individual database hosts. Which solution meets these requirements?"""
options = [
  "Add Aurora Replicas to the cluster and have the dashboard connect to the cluster's reader endpoint.",
  "Add Aurora Replicas to the cluster and have the dashboard connect to the cluster endpoint.",
  "Add Aurora Replicas to the cluster and have the dashboard rotate through each replica's instance endpoint.",
  "Move the writer to a larger instance class and keep the dashboard on the cluster endpoint.",
]
answer = ["A"]
explain = { A = "Correct. Aurora Replicas share the cluster volume, and the reader endpoint load-balances read-only connections across them, so the application needs only one name.", B = "The cluster endpoint always points at the writer, so the dashboard would still read from the saturated instance.", C = "This spreads reads, but the application would have to maintain and update a list of replica endpoints, which the company wants to avoid.", D = "A bigger writer helps for a while but does not scale reads out, and reads keep competing with writes." }
ref = "week_05_databases_and_caching/concepts/02_aurora.md"

[[question]]
id = "w05-q11"
domain = 2
task = "2.2"
services = ["Amazon Aurora", "Aurora Global Database"]
kind = "single"
stem = """A payments company runs Amazon Aurora PostgreSQL in us-east-1. Regulators require a disaster recovery design in ap-southeast-1 that replicates data with storage-level replication lag of typically under a second, serves low-latency local reads there, and can be promoted within minutes after a Regional outage. Which solution meets these requirements?"""
options = [
  "Copy automated snapshots to ap-southeast-1 every hour and restore the newest one after an outage.",
  "Add an Aurora Replica in ap-southeast-1 to the existing cluster.",
  "Use AWS DMS to replicate continuously into a new Aurora cluster in ap-southeast-1.",
  "Convert the cluster to an Aurora Global Database and add ap-southeast-1 as a secondary Region.",
]
answer = ["D"]
explain = { A = "Hourly snapshot copies lose up to an hour of data and take a long time to restore.", B = "An Aurora cluster lives in one Region; its replicas cannot be placed in another Region.", C = "DMS can replicate data, but it is a separate service to run and monitor, and it does not use Aurora's storage-level replication with promotion built in.", D = "Correct. Aurora Global Database replicates at the storage layer to read-only secondary Regions with typical lag under a second, and a secondary can be promoted in minutes." }
ref = "week_05_databases_and_caching/concepts/02_aurora.md"

[[question]]
id = "w05-q12"
domain = 4
task = "4.3"
services = ["Amazon Aurora", "Aurora Serverless v2"]
kind = "single"
stem = """A software team uses an Amazon Aurora MySQL-compatible database for development. Developers use it about three hours on weekdays, and it sits idle overnight and on weekends. The team wants to avoid paying for database compute while it is idle and accepts a short delay on the first connection after an idle period. Which configuration is the MOST cost-effective?"""
options = [
  "Run a small provisioned writer with a one-year Reserved Instance commitment.",
  "Use Aurora Serverless v2 with the minimum capacity set to 0 ACUs.",
  "Use Aurora Serverless v2 with the minimum capacity set to 0.5 ACUs.",
  "Run a provisioned writer and add Aurora Auto Scaling for replicas.",
]
answer = ["B"]
explain = { A = "A reserved instance lowers the hourly rate but is still billed around the clock, including the idle hours.", B = "Correct. A 0 ACU minimum turns on auto-pause after the idle time, so there is no compute charge while paused (storage is still billed), and the database resumes in about 15 seconds.", C = "This scales automatically, but the 0.5 ACU floor is billed all day, so it costs more than pausing.", D = "Replicas add cost, and the writer still runs and bills during the idle hours." }
ref = "week_05_databases_and_caching/concepts/02_aurora.md"

[[question]]
id = "w05-q13"
domain = 3
task = "3.3"
services = ["Amazon Aurora", "Aurora cloning"]
kind = "single"
stem = """A retailer needs a full copy of its multi-terabyte Aurora MySQL production cluster for a two-day performance test in the same account and Region. The copy must be ready within minutes, must not slow production, and should use as little extra storage as possible at first. Which solution meets these requirements?"""
options = [
  "Restore the latest automated backup to a new Aurora cluster.",
  "Export a snapshot to Amazon S3 and import it into a new Aurora cluster.",
  "Create an Aurora clone of the production cluster.",
  "Add a secondary cluster to a Global Database and detach it for the test.",
]
answer = ["C"]
explain = { A = "A restore copies the data into new storage, which takes much longer for a multi-terabyte volume and uses full extra storage.", B = "Exporting and importing moves all the data twice and takes far longer than minutes.", C = "Correct. A clone uses copy-on-write at the storage layer, so it is created quickly and allocates extra storage only as data pages change.", D = "A detached secondary receives a full copy of the data and requires a Global Database, which costs more and takes longer." }
ref = "week_05_databases_and_caching/concepts/02_aurora.md"

[[question]]
