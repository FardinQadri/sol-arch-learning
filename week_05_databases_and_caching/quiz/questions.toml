domain = 4
task = "4.3"
services = ["Amazon DynamoDB", "Application Auto Scaling"]
kind = "single"
stem = """An analytics company's DynamoDB table receives a steady, predictable load that rises gradually each business morning and falls at night, with the same pattern every week. The table uses on-demand capacity mode. The company wants to lower its DynamoDB throughput cost while still avoiding throttling. Which change is the MOST cost-effective?"""
options = [
  "Keep on-demand mode and configure a maximum throughput limit on the table.",
  "Switch to provisioned capacity mode with Application Auto Scaling target tracking.",
  "Switch to provisioned capacity mode with fixed capacity set to the weekly peak at all times.",
  "Move the table to the DynamoDB Standard-IA table class.",
]
answer = ["B"]
explain = { A = "A throughput cap controls spending but risks throttling, and per-request pricing stays higher than provisioned for a steady load.", B = "Correct. Provisioned capacity costs less per unit for a steady, predictable load, and auto scaling follows the daily curve so the table is not paying for peak capacity all night.", C = "This avoids throttling but pays for peak capacity around the clock, which costs more than following the curve.", D = "Standard-IA lowers storage cost, not throughput cost, and helps only when storage dominates the bill." }
ref = "week_05_databases_and_caching/concepts/03_dynamodb.md"

[[question]]
id = "w05-q17"
domain = 3
task = "3.3"
services = ["Amazon DynamoDB", "Global secondary index"]
kind = "single"
stem = """A company stores orders in a production DynamoDB table with partition key customerId and sort key orderDate. A new feature must list all orders with a given status, such as SHIPPED, sorted by shipDate, without scanning the table. The table already holds data and cannot be re-created. What should the architect do?"""
options = [
  "Add a local secondary index with partition key status and sort key shipDate.",
  "Run a Scan with a filter expression on status and sort the results in the application.",
  "Add a global secondary index with partition key status and sort key shipDate.",
  "Modify the table's primary key to use status as the partition key and shipDate as the sort key.",
]
answer = ["C"]
explain = { A = "A local secondary index must share the base table's partition key and can only be created together with the table.", B = "A Scan reads every item and charges for all of it, since the filter runs after the read.", C = "Correct. A global secondary index can use a different partition key and sort key and can be added to an existing table at any time.", D = "A table's primary key cannot be changed after the table is created." }
ref = "week_05_databases_and_caching/concepts/03_dynamodb.md"

[[question]]
id = "w05-q18"
domain = 3
task = "3.3"
services = ["Amazon DynamoDB", "Local secondary index"]
kind = "single"
stem = """A team built a DynamoDB table with partition key deviceId and sort key timestamp. Months later it must query one device's readings by a different sort key, batteryLevel, using strongly consistent reads. The team did not define a local secondary index when it created the table. What must the team do?"""
options = [
  "Create a new table that includes the local secondary index, copy the data into it, and switch the application over.",
  "Add the local secondary index to the existing table with an UpdateTable call.",
  "Add a global secondary index on deviceId and batteryLevel and request strongly consistent reads from it.",
  "Query the base table with a filter expression on batteryLevel to get results ordered by it.",
]
answer = ["A"]
explain = { A = "Correct. A local secondary index can only be defined at table creation, so the data must move to a new table that has one.", B = "UpdateTable can add global secondary indexes but cannot add a local secondary index.", C = "A global secondary index supports only eventually consistent reads.", D = "A filter expression only discards items after they are read; it neither reorders results nor uses a different sort key." }
ref = "week_05_databases_and_caching/concepts/03_dynamodb.md"

[[question]]
id = "w05-q19"
domain = 3
task = "3.3"
services = ["Amazon DynamoDB", "Conditional writes"]
kind = "single"
stem = """Two instances of an inventory service read the same DynamoDB item and may both try to update its quantity. The company wants an update to be rejected when another writer changed the item after it was read, and it does not want to add a separate locking service. Which approach meets this requirement?"""
options = [
  "Use strongly consistent reads before every update.",
  "Enable DynamoDB Streams and have a Lambda function reconcile conflicting updates.",
  "Submit the competing updates together in one BatchWriteItem request.",
  "Keep a version attribute and send UpdateItem with a condition that the stored version equals the version that was read.",
]
answer = ["D"]
explain = { A = "A strongly consistent read returns current data, but the item can still change between the read and the write.", B = "Streams report changes after they happen; they cannot reject the second write.", C = "BatchWriteItem is not atomic and does not check whether an item changed since it was read.", D = "Correct. This is optimistic locking: a failed condition raises ConditionalCheckFailedException and the writer must re-read and retry." }
ref = "week_05_databases_and_caching/concepts/03_dynamodb.md"

[[question]]
id = "w05-q20"
domain = 3
task = "3.3"
services = ["Amazon DynamoDB", "Transactions"]
kind = "single"
stem = """A banking application moves funds by decrementing the balance in one DynamoDB item and incrementing it in a second item, both in the same table and Region. Either both changes must be applied or neither. Which API should the developer use?"""
options = [
  "BatchWriteItem with one request for each of the two items.",
  "TransactWriteItems with an update action for each of the two items.",
  "Two sequential UpdateItem calls, each with a condition expression.",
  "Two UpdateItem calls, with a Lambda function on the stream undoing the first if the second fails.",
]
answer = ["B"]
