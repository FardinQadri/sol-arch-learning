services = ["Amazon Neptune"]
kind = "single"
stem = """A bank wants to detect fraud rings by finding accounts that share devices, addresses and phone numbers across several hops of relationships. Analysts must traverse these connections in near real time, and the number of relationship types keeps growing. Which solution fits this workload best?"""
options = [
  "Model the data in Aurora MySQL tables and join them through recursive queries.",
  "Store each account in DynamoDB and add a global secondary index for each relationship type.",
  "Load the data into Amazon Neptune and query it with Gremlin or openCypher.",
  "Index every attribute in Amazon OpenSearch Service and search for matching values.",
]
answer = ["C"]
