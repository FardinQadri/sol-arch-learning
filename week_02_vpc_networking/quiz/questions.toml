task = "1.2"
services = ["AWS PrivateLink", "Network Load Balancer", "Amazon VPC"]
kind = "multi"
choose = 2
stem = """A software vendor runs an API in its own account's VPC and wants a customer's account to call it privately. The two VPCs use overlapping CIDR blocks, and the vendor must not expose any other resources in its VPC. Which combination of steps meets these requirements? (Select TWO.)"""
options = [
