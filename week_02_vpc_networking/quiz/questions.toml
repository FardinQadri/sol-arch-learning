[[question]]
id = "w02-q01"
domain = 3
task = "3.4"
services = ["Amazon VPC"]
kind = "single"
stem = """A logistics company is building a subnet for a fleet-tracking service that will run up to 120 network interfaces at peak, including EC2 instances and Lambda-attached interfaces. The subnet should be the smallest IPv4 block that can hold them all, so the rest of the VPC range stays free for other subnets. Which subnet size should the architect choose?"""
options = [
  "A /24 subnet, which has 256 addresses.",
  "A /25 subnet, which has 128 addresses.",
  "A /26 subnet, which has 64 addresses.",
  "A /27 subnet, which has 32 addresses.",
]
answer = ["B"]
explain = { A = "It fits, but it is larger than needed. The requirement is the smallest block that holds 120 interfaces.", B = "Correct. AWS reserves 5 addresses in every subnet, so a /25 leaves 123 usable addresses, enough for 120.", C = "A /26 has 64 addresses and only 59 usable after the 5 reserved ones, which is far short of 120.", D = "A /27 has 32 addresses and only 27 usable, so it cannot hold the fleet." }
ref = "week_02_vpc_networking/concepts/01_vpc_subnets_and_cidr.md"

[[question]]
id = "w02-q02"
domain = 3
task = "3.4"
services = ["Amazon VPC", "VPC Peering"]
kind = "single"
stem = """A retailer is creating a new VPC for its payments platform. The production VPC uses 10.0.0.0/16 and a data VPC in another account uses 10.1.0.0/16. The head office network, which will connect later over a VPN, uses 192.168.0.0/16. The payments VPC must be able to peer with both VPCs and reach the head office without renumbering anything. Which CIDR block should the architect choose for the new VPC?"""
options = [
  "10.1.0.0/20",
  "10.0.128.0/17",
  "172.16.0.0/16",
  "192.168.64.0/18",
]
answer = ["C"]
explain = { A = "It sits inside the data VPC's 10.1.0.0/16, so a peering request would be rejected for overlapping CIDRs.", B = "It sits inside the production VPC's 10.0.0.0/16, so it overlaps and cannot be peered.", C = "Correct. 172.16.0.0/16 is a private range that overlaps none of the three existing networks, so peering and the later VPN both work.", D = "It sits inside the head office's 192.168.0.0/16, so routing to the office would be ambiguous." }
ref = "week_02_vpc_networking/concepts/01_vpc_subnets_and_cidr.md"

[[question]]
id = "w02-q03"
domain = 3
task = "3.4"
services = ["Amazon VPC"]
kind = "single"
stem = """A media company's VPC has a primary IPv4 CIDR of 10.0.0.0/24, and every address in its subnets is allocated. The team must add more subnets for a new service in the same VPC, without migrating the existing workloads or changing their IP addresses. The company has not used the 10.1.0.0/16 range anywhere. What should the architect do?"""
options = [
  "Associate 10.1.0.0/16 as a secondary CIDR block and create the new subnets in it.",
  "Modify the primary CIDR block of the VPC from /24 to /16 in place.",
  "Disassociate the primary CIDR block and associate a larger block in its place.",
  "Create a second VPC with a /16 CIDR block and move the existing workloads into it.",
]
answer = ["A"]
explain = { A = "Correct. A VPC can have additional IPv4 CIDR blocks that do not overlap the existing ones, and subnets can be created from them.", B = "An existing CIDR block cannot be resized. Only additional blocks can be associated.", C = "The primary CIDR block cannot be disassociated from a VPC.", D = "It would work, but it forces the migration and re-addressing the team wants to avoid." }
ref = "week_02_vpc_networking/concepts/01_vpc_subnets_and_cidr.md"

[[question]]
id = "w02-q04"
domain = 3
task = "3.4"
services = ["Amazon VPC", "Internet Gateway"]
kind = "single"
stem = """A startup launches web servers into a new subnet. An internet gateway is attached to the VPC, the instances receive public IPv4 addresses, the security group allows all outbound traffic and the subnet uses the default network ACL. The servers still cannot reach the internet. The subnet's route table contains only the local route. What should the architect change?"""
options = [
  "Associate an Elastic IP address with the internet gateway and the subnet's route table.",
  "Add a 0.0.0.0/0 route that targets a NAT gateway placed in the same subnet.",
  "Add an outbound allow-all rule to the subnet's network ACL.",
  "Add a 0.0.0.0/0 route that targets the internet gateway to the subnet's route table.",
]
answer = ["D"]
explain = { A = "Elastic IP addresses attach to network interfaces or NAT gateways, not to an internet gateway.", B = "A NAT gateway itself needs a route to the internet gateway in its subnet, so this does not make the subnet public.", C = "The default network ACL already allows all traffic in both directions. It is not the blocker.", D = "Correct. A subnet is public when its route table has a route to an internet gateway. Without it, public IPs are useless." }
ref = "week_02_vpc_networking/concepts/02_routing_internet_and_nat.md"

[[question]]
id = "w02-q05"
domain = 2
task = "2.2"
services = ["Amazon VPC", "NAT Gateway"]
kind = "single"
stem = """A company runs application servers in private subnets across three Availability Zones. A single NAT gateway sits in the public subnet of one AZ, and all three private route tables point to it. During an AZ outage, servers in the two healthy AZs lost all outbound internet access. The architect must remove this single point of failure. What should the architect do?"""
options = [
  "Add a second NAT gateway to the same public subnet and add its route alongside the first.",
  "Create a NAT gateway per AZ and route each AZ's private subnets to its own gateway.",
  "Replace the NAT gateway with a NAT instance in the same public subnet.",
  "Associate additional Elastic IP addresses with the existing NAT gateway.",
]
answer = ["B"]
explain = { A = "Both gateways would still live in the failed AZ, and a route table sends traffic to one target per destination.", B = "Correct. A NAT gateway is redundant only within its own AZ, so each AZ needs its own gateway and a local route.", C = "A NAT instance in the same AZ has the same failure domain, and it adds management work.", D = "Extra addresses add port capacity, not availability. The gateway is still in one AZ." }
ref = "week_02_vpc_networking/concepts/02_routing_internet_and_nat.md"

[[question]]
id = "w02-q06"
domain = 2
task = "2.2"
services = ["Elastic Load Balancing", "Amazon EC2", "Amazon VPC"]
kind = "single"
stem = """A ticketing company hosts a public website on EC2 instances that must not have public IP addresses. The site must stay available if one Availability Zone fails, and users reach it from the internet over HTTPS. Which network design meets these requirements?"""
options = [
  "An internet-facing ALB in public subnets in two AZs, with the instances in private subnets of both.",
  "An internet-facing Application Load Balancer in one public subnet, with the instances in private subnets in two AZs.",
  "An internal Application Load Balancer in two private subnets, with an internet gateway route added to those subnets.",
  "Instances in public subnets in two AZs with Elastic IP addresses and a security group that allows HTTPS from anywhere.",
]
answer = ["A"]
explain = { A = "Correct. The load balancer takes internet traffic in public subnets, and the private instances keep no public addresses in either AZ.", B = "A load balancer needs subnets in at least two AZs, and one public subnet leaves it with no AZ redundancy.", C = "An internal load balancer has private addresses only, so internet users cannot reach it.", D = "Elastic IP addresses are public addresses, which the requirement forbids." }
ref = "week_02_vpc_networking/concepts/02_routing_internet_and_nat.md"

[[question]]
id = "w02-q07"
domain = 2
task = "2.2"
services = ["NAT Gateway", "Amazon EC2", "Amazon VPC"]
kind = "single"
stem = """A small team runs a fleet of EC2 instances in a private subnet. The instances need outbound access to the internet to download OS patches, and nothing on the internet may start a connection to them. The team has no network engineer and wants the LEAST operational overhead for the egress path. What should the architect deploy?"""
options = [
  "An EC2 NAT instance with source/destination check disabled, kept alive by an Auto Scaling group.",
  "An internet gateway for the private subnet, with a public IPv4 address on each instance.",
  "A public NAT gateway in a public subnet, with a 0.0.0.0/0 route from the private subnet to it.",
  "A fleet of proxy servers in the public subnet, managed by the team with its own failover scripts.",
]
answer = ["C"]
explain = { A = "It works, but the team patches, sizes and recovers the instance itself, which is the overhead to avoid.", B = "Public addresses on instances make them reachable from the internet, which the requirement rules out.", C = "Correct. A NAT gateway is managed and scales on its own, and it allows outbound connections only.", D = "It works, but a self-managed proxy fleet carries more operational overhead than a managed gateway." }
ref = "week_02_vpc_networking/concepts/02_routing_internet_and_nat.md"

[[question]]
id = "w02-q08"
domain = 2
task = "2.2"
services = ["Egress-only Internet Gateway", "Amazon VPC"]
kind = "single"
stem = """An analytics company has dual-stack instances in a private subnet that call external IPv6 APIs. The instances must be able to start outbound IPv6 connections, and no host on the internet may be able to start a connection to them. Which change meets this requirement?"""
options = [
  "Add a ::/0 route that targets the VPC's internet gateway.",
  "Add a ::/0 route that targets a gateway VPC endpoint.",
  "Add a ::/0 route that targets a virtual private gateway.",
  "Add a ::/0 route to a new egress-only internet gateway.",
]
answer = ["D"]
explain = { A = "An internet gateway also accepts inbound connections from the internet, so the instances would be reachable.", B = "Gateway endpoints exist only for S3 and DynamoDB. They do not carry general IPv6 internet traffic.", C = "A virtual private gateway leads to a VPN or Direct Connect network, not the internet.", D = "Correct. An egress-only internet gateway is stateful and allows outbound IPv6 only, blocking connections started from outside." }
ref = "week_02_vpc_networking/concepts/02_routing_internet_and_nat.md"

[[question]]
id = "w02-q09"
domain = 2
task = "2.2"
services = ["AWS Systems Manager", "Amazon VPC", "IAM"]
kind = "multi"
choose = 2
stem = """A bank's administrators need interactive shell access to EC2 instances in private subnets. The instances have no public IP addresses and no inbound security group rules, and the VPC has no NAT gateway or internet gateway. The bank wants to avoid running a bastion host. Which combination of steps allows the access? (Select TWO.)"""
