stem = """A company runs a short-lived training lab VPC and a production VPC, each with private subnets in three Availability Zones. The lab can tolerate a short loss of internet access. Production must survive the loss of an AZ. The company wants the MOST cost-effective NAT design that still meets each requirement. Which combination of choices should the architect make? (Select TWO.)"""
