stem = """A bucket policy denies all requests unless aws:SourceIp equals the Elastic IP of the VPC's NAT gateway. The team adds an S3 gateway endpoint to cut NAT costs, and the instances' requests are now denied. The VPC has two S3 endpoints, one per team, and the bucket must be readable from anything inside this VPC. Which condition should the bucket policy use?"""
