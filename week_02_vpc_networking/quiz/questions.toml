task = "1.2"
services = ["Amazon S3", "Gateway VPC Endpoint", "Amazon VPC"]
kind = "single"
stem = """A research institute stores datasets in an S3 bucket. Compliance requires that the bucket is read only from EC2 instances in one VPC, over the AWS network, without a NAT gateway or any internet path. Credentials alone must not be enough to read the data from elsewhere. Which solution meets the requirement?"""
