  "Release the idle Elastic IPs and move the dev instances to private subnets behind a NAT gateway in each AZ.",
  "Associate the idle Elastic IPs with the dev instances in place of their auto-assigned public addresses.",
  "Release the idle Elastic IPs and remove the public IPv4 addresses from the dev instances.",
]
answer = ["D"]
explain = { A = "The NAT gateway adds hourly and per-GB charges, and the 40 idle addresses keep billing.", B = "It removes the public addresses, but NAT gateways in every AZ cost more than they save, and Session Manager already works through the endpoints.", C = "It swaps 40 auto-assigned addresses for the Elastic IPs, so 60 addresses still bill each hour. Option D leaves none.", D = "Correct. Releasing idle addresses stops their charge, and Session Manager reaches the instances through the existing endpoints, so public addresses add nothing." }
