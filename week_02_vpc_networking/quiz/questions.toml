kind = "single"
stem = """VPC A is peered with VPC B and with VPC C. The three VPCs use different, non-overlapping CIDR blocks. The team in VPC B now needs to reach servers in VPC C, and routes in B's table point at VPC A's peering connection for C's range, but traffic fails. The team wants the simplest fix. What should the architect do?"""
