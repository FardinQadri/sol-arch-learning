stem = """A cost audit of a dev account finds 40 Elastic IP addresses that are not associated with anything. It also finds 60 dev instances in public subnets with public IPv4 addresses. Engineers reach them only through Session Manager, and the VPC already has interface endpoints for Systems Manager. Every public IPv4 address is billed per hour, in use or idle. Which action removes the MOST public IPv4 cost with the least impact on the team?"""
