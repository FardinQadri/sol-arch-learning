services = ["Interface VPC Endpoint", "AWS PrivateLink"]
kind = "single"
stem = """A non-production VPC has interface endpoints for six AWS services, each deployed in subnets in three Availability Zones. All workloads in this VPC run in one AZ only, and the team can accept no change to how the applications reach the services. Which action cuts cost the MOST?"""
options = [
  "Reduce each interface endpoint to the subnet in the AZ where the workloads run.",
  "Delete the endpoints and put a NAT gateway in each of the three AZs.",
  "Turn off private DNS on every endpoint.",
  "Replace the endpoint security groups with network ACLs.",
]
answer = ["A"]
explain = { A = "Correct. Interface endpoints are billed per hour for each AZ they occupy, so unused AZs only add charges.", B = "It works, but three NAT gateways add hourly charges plus per-GB processing, and applications still pay for their data.", C = "Private DNS controls name resolution, not billing, and turning it off would also change how the apps reach the services.", D = "Security groups and network ACLs carry no charge, so swapping them saves nothing." }
ref = "week_02_vpc_networking/concepts/04_vpc_endpoints_and_privatelink.md"

[[question]]
id = "w02-q28"
domain = 4
task = "4.4"
services = ["Amazon ElastiCache", "Amazon EC2", "Amazon VPC"]
kind = "single"
stem = """A web tier in two Availability Zones makes thousands of small reads per second against one cache node in AZ-b. Half of those requests cross from AZ-a, and the cross-AZ data transfer charge has become significant. The application must stay highly available across both AZs. Which design reduces the charge at the LOWEST cost?"""
options = [
  "Move the whole web tier and cache into AZ-b only.",
  "Put a Network Load Balancer with cross-zone load balancing in front of the single cache node.",
  "Run a cache node in each AZ, with each web server reading from the node in its own AZ.",
  "Run a cache cluster in each AZ and replicate every write between them over a transit gateway.",
]
answer = ["C"]
explain = { A = "It removes the cross-AZ traffic but gives up the high availability the application needs.", B = "It adds a load balancer and spreads requests across AZs, which does not reduce cross-AZ traffic.", C = "Correct. Same-AZ reads avoid the cross-AZ charge, and the second node keeps the tier available if one AZ fails.", D = "It works, but replication through a transit gateway adds per-GB processing on top of the transfer charges." }
ref = "week_02_vpc_networking/concepts/01_vpc_subnets_and_cidr.md"

[[question]]
