[[question]]
id = "w02-q22"
domain = 3
task = "3.4"
services = ["AWS Transit Gateway", "VPC Peering"]
kind = "single"
stem = """A company has 20 VPCs across several accounts in one Region. Any VPC must be able to reach any other VPC, and the company will add more VPCs and an on-premises network over time. The network team wants the LEAST operational overhead as the number of VPCs grows. Which design should the architect choose?"""
options = [
  "A full mesh of VPC peering connections between all 20 VPCs.",
  "A Site-to-Site VPN connection between every pair of VPCs.",
  "One large VPC with all workloads moved into it.",
  "A transit gateway with a VPC attachment for each VPC.",
]
answer = ["D"]
explain = { A = "It works, but 20 VPCs need 190 peering connections, each with routes, and every new VPC adds 20 more.", B = "VPNs between VPCs add tunnels to manage and bandwidth limits for no benefit.", C = "It would force migrating and re-addressing every workload, and it removes the account separation.", D = "Correct. A transit gateway is a regional hub with transitive routing, so each new VPC needs just one attachment." }
ref = "week_02_vpc_networking/concepts/05_connecting_vpcs_and_networks.md"

[[question]]
id = "w02-q23"
domain = 3
task = "3.4"
services = ["AWS Transit Gateway", "Amazon VPC"]
kind = "single"
stem = """A company's dev and prod VPCs are both attached to one transit gateway, along with a shared-services VPC that holds DNS and tooling. Dev and prod must each reach shared services but must not be able to reach each other. The company wants to enforce this with routing on the existing transit gateway. What should the architect do?"""
options = [
  "Give dev and prod a table with only shared-services routes, and shared services a table with dev and prod routes.",
  "Keep all attachments in the default route table and add a blackhole route for the dev CIDR and one for the prod CIDR.",
  "Keep all attachments in the default route table and turn off route propagation from the dev and prod attachments.",
  "Associate each VPC with its own route table and propagate every attachment into every other table.",
]
answer = ["A"]
explain = { A = "Correct. The dev/prod table knows only shared services, so dev and prod cannot reach each other, and the shared-services table knows both ranges, so it can reply.", B = "A blackhole in the one shared table drops traffic to dev and prod from every attachment, including shared services, so its replies fail.", C = "With no dev or prod routes in the table, shared services has no route back, so replies to dev and prod fail.", D = "Every table still learns every range, so dev can reach prod." }
ref = "week_02_vpc_networking/concepts/05_connecting_vpcs_and_networks.md"

[[question]]
id = "w02-q24"
domain = 3
task = "3.4"
services = ["AWS Site-to-Site VPN", "Direct Connect"]
kind = "single"
stem = """A manufacturer needs its branch office network to reach a VPC within two days. The traffic must be encrypted, and the office already has a router with a public IP address and an internet connection. A dedicated line can be considered later. Which solution should the architect choose first?"""
options = [
  "An AWS Direct Connect connection, which is ordered and installed now.",
  "A VPC peering connection between the VPC and the office network.",
  "A Site-to-Site VPN connection that ends on a virtual private gateway, with the office router as the customer gateway.",
  "A separate Client VPN session on each employee's laptop.",
]
answer = ["C"]
explain = { A = "A circuit takes weeks to provision, and the link itself is not encrypted by default.", B = "Peering connects two VPCs only, never an office network.", C = "Correct. A VPN uses IPsec over the existing internet link and can be set up within hours.", D = "It works per user, but the requirement is the whole office network reaching the VPC." }
ref = "week_02_vpc_networking/concepts/05_connecting_vpcs_and_networks.md"

[[question]]
id = "w02-q25"
domain = 3
task = "3.4"
services = ["AWS Resource Access Manager", "Amazon VPC", "AWS Organizations"]
kind = "single"
stem = """A company uses AWS Organizations. A central network account owns a VPC, and twelve application accounts must launch their EC2 instances and databases directly in that VPC's subnets, so the network team can manage routing and firewalls in one place. The company wants no peering connections and no duplicate address ranges. What should the architect do?"""
options = [
  "Create a VPC in each application account and peer each one with the central VPC.",
  "Attach every application account's VPC to a transit gateway owned by the network account.",
  "Copy the central VPC's configuration into each application account.",
  "Share the central VPC's subnets with the application accounts through AWS Resource Access Manager.",
]
answer = ["D"]
explain = { A = "Peering is explicitly ruled out, and it leaves the team managing twelve separate VPCs.", B = "It still means twelve separate VPCs with their own ranges, not shared subnets.", C = "Duplicate VPCs would overlap and could not be managed in one place.", D = "Correct. Subnet sharing lets other accounts launch resources into the owner's subnets while the owner controls the network." }
ref = "week_02_vpc_networking/concepts/05_connecting_vpcs_and_networks.md"

[[question]]
id = "w02-q26"
domain = 4
task = "4.4"
services = ["NAT Gateway", "Gateway VPC Endpoint", "Amazon S3"]
kind = "single"
stem = """A data company runs ETL instances in private subnets that read and write about 18 TB of data per month in S3 buckets in the same Region. All of this traffic goes through NAT gateways, and the NAT data processing charge is the largest line on the networking bill. Which change is the MOST cost-effective way to reduce it?"""
options = [
  "Create another NAT gateway in each AZ and split the traffic between them.",
  "Create an S3 gateway endpoint and add it to the private route tables.",
  "Create an S3 interface endpoint in each AZ and use its endpoint-specific names.",
  "Move to a larger NAT gateway size to lower the per-GB rate.",
]
answer = ["B"]
explain = { A = "More gateways spread the load, but each one still charges per GB processed, and each adds an hourly charge.", B = "Correct. A gateway endpoint adds no hourly or per-GB charge, and S3 traffic stops passing through the NAT gateway.", C = "It also keeps traffic off the NAT gateway, but it adds an hourly charge per AZ and a per-GB charge.", D = "NAT gateways have no sizes, and the per-GB rate does not change with volume." }
ref = "week_02_vpc_networking/concepts/04_vpc_endpoints_and_privatelink.md"

[[question]]
id = "w02-q27"
domain = 4
