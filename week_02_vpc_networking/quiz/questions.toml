  "Add a bucket policy that denies requests unless aws:SourceIp is within the VPC's CIDR block.",
]
answer = ["C"]
explain = { A = "The private path exists, but the bucket still accepts anyone with valid credentials from anywhere.", B = "No endpoint exists, so no request can ever match the condition, and the instances would lose access.", C = "Correct. The endpoint gives the private path, and the bucket policy limits access to requests that arrive through it.", D = "Requests through an endpoint carry no usable public source IP, and the VPC's private range would never match." }
