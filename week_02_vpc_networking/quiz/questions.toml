ref = "week_02_vpc_networking/concepts/02_routing_internet_and_nat.md"

[[question]]
id = "w02-q10"
domain = 1
task = "1.2"
services = ["Security Groups", "Amazon RDS", "Auto Scaling"]
kind = "single"
stem = """A web tier runs in an Auto Scaling group whose instances come and go, and its subnets also hold unrelated batch servers. A MySQL database in another subnet must accept connections on port 3306 only from the web tier. Which rule on the database's security group meets this requirement?"""
options = [
  "An inbound rule for TCP 3306 whose source is the web tier's security group.",
  "An inbound rule for TCP 3306 for the private IP address of each current web instance.",
  "An inbound rule for TCP 3306 whose source is the CIDR of the subnets that hold the web tier.",
  "An inbound rule for TCP 3306 from 0.0.0.0/0, relying on the database password.",
]
answer = ["A"]
explain = { A = "Correct. Referencing the web security group follows instances as they scale and admits nothing else.", B = "Instance addresses change as the group scales, so the rule goes stale and needs constant edits.", C = "The batch servers share those subnets, so they would gain access as well.", D = "It exposes the database port to every address, replacing network control with a password." }
ref = "week_02_vpc_networking/concepts/03_security_groups_and_nacls.md"

[[question]]
id = "w02-q11"
domain = 1
task = "1.2"
services = ["Network ACLs", "Amazon VPC"]
kind = "single"
stem = """A public web subnet uses the default network ACL, which has rule 100 allowing all inbound traffic. Logs show that the range 198.51.100.0/24 is flooding the site with requests, and the team must block that range for the whole subnet while leaving everyone else unaffected. What should the architect do?"""
options = [
  "Add an inbound DENY rule for 198.51.100.0/24 to the network ACL with rule number 150.",
  "Add an inbound DENY rule for 198.51.100.0/24 to the network ACL with rule number 50.",
  "Add a deny rule for 198.51.100.0/24 to the security group of every instance in the subnet.",
  "Add an outbound DENY rule for 198.51.100.0/24 to the network ACL with rule number 50.",
]
answer = ["B"]
explain = { A = "Rules run in ascending order and the first match wins. Rule 100 allows the traffic first, so a deny at 150 is never reached.", B = "Correct. Rule 50 is evaluated before rule 100, so the range is denied and all other traffic still matches the allow.", C = "Security groups have allow rules only. They cannot contain a deny.", D = "An outbound rule affects traffic leaving the subnet, not requests arriving from that range." }
ref = "week_02_vpc_networking/concepts/03_security_groups_and_nacls.md"

[[question]]
id = "w02-q12"
domain = 1
task = "1.2"
services = ["Network ACLs", "Amazon EC2"]
kind = "single"
stem = """A team gives a public web subnet a custom network ACL. Its only rules are an inbound allow for TCP 443 from 0.0.0.0/0 and an outbound allow for TCP 443 to 0.0.0.0/0. The security group allows inbound HTTPS. Browsers now time out when they connect to the servers. What should the architect add?"""
options = [
  "An inbound allow rule for TCP 1024-65535 from 0.0.0.0/0.",
  "An outbound allow rule for UDP 53 to 0.0.0.0/0.",
  "An outbound allow rule for TCP 1024-65535 to 0.0.0.0/0.",
  "An outbound rule for TCP 1024-65535 in the instance's security group.",
]
answer = ["C"]
explain = { A = "The requests already arrive on port 443. The blocked traffic is the reply leaving the subnet.", B = "The servers are answering clients, not resolving names. DNS is not the problem.", C = "Correct. Network ACLs are stateless, and replies go to the client's ephemeral port, so the outbound direction must allow that range.", D = "Security groups are stateful and already let replies out. The block is at the network ACL." }
ref = "week_02_vpc_networking/concepts/03_security_groups_and_nacls.md"

[[question]]
id = "w02-q13"
domain = 1
task = "1.2"
services = ["Security Groups", "Amazon EC2"]
kind = "single"
stem = """A developer creates a new security group for a stand-alone web server and adds no rules to it. The server must accept HTTPS from anywhere on the internet and must be able to download updates over HTTPS. The developer wants to add the fewest rules possible. What should the developer do?"""
options = [
  "Add an inbound rule for TCP 443 and outbound rules for TCP 80 and 443.",
  "Add an inbound rule for TCP 443 and an outbound allow-all rule.",
  "Attach the VPC's default security group instead of the new one.",
  "Add only an inbound rule for TCP 443 from 0.0.0.0/0.",
]
answer = ["D"]
explain = { A = "It works, but a new security group already allows all outbound traffic, so the outbound rules are redundant.", B = "It works, but the allow-all outbound rule is already present on a new security group.", C = "The default security group allows inbound traffic only from itself, so the internet could not reach the server.", D = "Correct. A new security group denies all inbound traffic and allows all outbound, so one inbound rule completes it." }
ref = "week_02_vpc_networking/concepts/03_security_groups_and_nacls.md"

[[question]]
id = "w02-q14"
domain = 1
task = "1.2"
services = ["Network ACLs", "NAT Gateway"]
kind = "single"
stem = """Batch servers in a private subnet call external HTTPS APIs through a NAT gateway. The subnet's custom network ACL allows outbound TCP 443 to 0.0.0.0/0 and inbound TCP 22 from 10.0.0.0/8 only. The security group allows all outbound traffic. The API calls time out, and the requests do leave the subnet. What should the architect change?"""
options = [
  "Add an inbound allow for TCP 1024-65535 from 0.0.0.0/0 to the network ACL.",
  "Add an inbound rule for TCP 1024-65535 to the security group of the batch instances.",
  "Add an inbound allow rule for TCP 443 from 0.0.0.0/0 to the network ACL.",
  "Add an outbound allow rule for TCP 1024-65535 to the network ACL.",
]
answer = ["A"]
explain = { A = "Correct. The network ACL is stateless, so the API replies arriving on ephemeral ports need an explicit inbound allow.", B = "The security group is stateful and already admits replies to connections the instance started.", C = "Replies arrive at the client's ephemeral port, not at port 443, so this rule matches nothing useful.", D = "The requests already leave the subnet. The blocked direction is the inbound reply." }
ref = "week_02_vpc_networking/concepts/03_security_groups_and_nacls.md"

[[question]]
id = "w02-q15"
domain = 1
task = "1.2"
services = ["VPC Flow Logs", "Amazon S3", "Amazon Athena"]
kind = "single"
stem = """After a network ACL change, several tiers of an application cannot reach each other, and the team does not know which source and destination pairs are being refused. They want a record of the refused connections across the whole VPC, with the least effort and without touching the instances. What should the architect do?"""
options = [
  "Turn on AWS CloudTrail data events and search them for denied network calls.",
  "Create a VPC flow log for REJECT traffic to S3 and query it with Athena.",
  "Configure Traffic Mirroring for every instance and inspect the packets in an appliance.",
  "Enable detailed monitoring on all instances and read the network metrics in CloudWatch.",
]
answer = ["B"]
explain = { A = "CloudTrail records API calls, not network connections between instances.", B = "Correct. A flow log at VPC level records source, destination and port for each flow, and a REJECT filter keeps only the refused ones.", C = "It works, but it needs mirrored sessions on every interface and a packet appliance, which is far more effort.", D = "Instance metrics count bytes and packets. They do not show which connections were refused." }
ref = "week_02_vpc_networking/concepts/03_security_groups_and_nacls.md"

[[question]]
