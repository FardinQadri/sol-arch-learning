ref = "week_03_compute_and_scaling/concepts/05_elastic_load_balancing.md"

[[question]]
id = "w03-q22"
domain = 3
task = "3.2"
services = ["Network Load Balancer", "Elastic IP"]
kind = "single"
stem = """A payments company exposes a TCP service on EC2 instances to bank partners. Each partner firewall allows only a small fixed list of IP addresses, one address for each Availability Zone. The backend must see each client's original source IP address. Which load balancer design meets these requirements?"""
options = [
  "An internet-facing ALB with an Elastic IP address in each subnet, passing X-Forwarded-For to the instances.",
  "An internet-facing ALB with a Route 53 alias record that returns the ALB addresses.",
  "An internet-facing Network Load Balancer with an Elastic IP address per AZ and instance targets.",
  "A Gateway Load Balancer with firewall instances as targets in each Availability Zone.",
]
answer = ["C"]
