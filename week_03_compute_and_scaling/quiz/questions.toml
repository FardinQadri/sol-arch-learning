ref = "week_03_compute_and_scaling/concepts/05_elastic_load_balancing.md"

[[question]]
id = "w03-q23"
domain = 3
task = "3.2"
services = ["Network Load Balancer"]
kind = "single"
stem = """A game studio runs UDP-based game servers on EC2. Peak traffic reaches millions of requests per second, and latency must stay in the low milliseconds. Players connect through one DNS name. Which load balancer should the architect use?"""
options = [
  "A Network Load Balancer with a UDP listener.",
  "An Application Load Balancer with a UDP listener.",
  "A Classic Load Balancer with a UDP listener.",
  "A Gateway Load Balancer with a UDP listener.",
]
answer = ["A"]
explain = { A = "Correct. A Network Load Balancer works at layer 4, supports TCP, UDP and TLS, and handles millions of requests per second at very low latency.", B = "An ALB listens on HTTP and HTTPS only, not UDP.", C = "A Classic Load Balancer is the previous generation, with TCP, SSL, HTTP and HTTPS listeners only.", D = "A Gateway Load Balancer carries GENEVE traffic to inspection appliances. It is not for serving a game." }
ref = "week_03_compute_and_scaling/concepts/05_elastic_load_balancing.md"

[[question]]
id = "w03-q24"
domain = 3
task = "3.2"
services = ["Gateway Load Balancer", "Amazon VPC"]
kind = "single"
stem = """A bank must inspect all traffic entering and leaving its VPC with a third-party firewall appliance sold as an AMI. The vendor's product is mandatory. The appliances must scale with traffic, and traffic must pass through them transparently without any change to the applications. Which design should the architect use?"""
options = [
  "Put the appliances behind a Network Load Balancer and change each application to send traffic to its address.",
  "Put the appliances behind an ALB with AWS WAF and point the route tables at the ALB.",
  "Deploy AWS Network Firewall in the VPC and migrate the vendor's rules into it.",
  "Put the appliances behind a Gateway Load Balancer and route traffic through Gateway Load Balancer endpoints.",
]
answer = ["D"]
explain = { A = "Applications would have to be changed to target the load balancer, which breaks the transparency requirement.", B = "A route table cannot target an ALB, and an ALB works at layer 7, not on all IP traffic.", C = "Network Firewall is managed by AWS and would replace the mandatory vendor product.", D = "Correct. A Gateway Load Balancer works at layer 3, forwards all IP packets with GENEVE, and scales a fleet of virtual appliances behind route-table-based endpoints." }
ref = "week_03_compute_and_scaling/concepts/05_elastic_load_balancing.md"

[[question]]
id = "w03-q25"
domain = 2
task = "2.1"
services = ["Network Load Balancer", "Elastic Load Balancing"]
kind = "single"
stem = """A company runs a TCP service behind an internet-facing Network Load Balancer enabled in two Availability Zones. AZ a holds 2 targets and AZ b holds 8. Clients are spread evenly across the two NLB addresses, so the 2 instances in AZ a are saturated while those in AZ b stay idle. The company cannot move capacity between zones. What should the architect do?"""
options = [
  "Turn on sticky sessions for the target group.",
  "Turn on cross-zone load balancing for the load balancer.",
  "Register the targets by IP address instead of by instance ID.",
  "Turn off client IP preservation on the target group.",
]
answer = ["B"]
explain = { A = "Stickiness keeps a client on the same target, which does not rebalance the load between zones.", B = "Correct. Cross-zone load balancing is off by default on an NLB, so each zone's node sends traffic only to its own targets. Turning it on spreads requests across all 10 targets, with inter-AZ data transfer charges.", C = "The target type has no effect on how traffic is divided between zones.", D = "Client IP preservation controls the source address the target sees, not the distribution." }
ref = "week_03_compute_and_scaling/concepts/05_elastic_load_balancing.md"

[[question]]
id = "w03-q26"
domain = 4
task = "4.2"
services = ["Savings Plans", "Amazon EC2", "AWS Lambda"]
kind = "single"
stem = """A company runs a steady baseline workload on m7g and c7i instances plus Lambda functions, around the clock. In six months it plans to move the x86 instances to Graviton and may change instance families again. It wants the lowest cost for the next year without changing how the workloads are deployed. Which is the MOST cost-effective option?"""
options = [
  "Buy a one-year Compute Savings Plan sized to the steady baseline.",
  "Buy one-year Standard Reserved Instances for each current instance type.",
  "Buy a one-year EC2 Instance Savings Plan for the m7g family only.",
  "Keep everything On-Demand and review the bill every quarter.",
]
answer = ["A"]
explain = { A = "Correct. A Compute Savings Plan discounts any instance family, size and Region, and also applies to Lambda, so it follows the planned migration.", B = "Standard RIs are tied to an instance type, so the c7i reservations would sit unused after the move to Graviton, and they do not cover Lambda.", C = "An EC2 Instance Savings Plan is tied to one family in a Region and does not cover c7i or Lambda.", D = "It works with no commitment, but it pays full On-Demand prices for a steady workload." }
ref = "week_03_compute_and_scaling/concepts/02_purchasing_options.md"

[[question]]
id = "w03-q27"
domain = 4
task = "4.2"
services = ["Amazon EC2 Auto Scaling", "Spot Instances"]
kind = "multi"
choose = 2
stem = """A media company runs a stateless transcoding service in an Auto Scaling group of up to 20 instances. At least 4 instances must always run, and the service tolerates interruption of the instances above that number. The company wants the lowest cost that respects this rule. Which combination of steps meets these requirements? (Select TWO.)"""
options = [
  "Use the lowest-price Spot allocation strategy with a single instance type.",
  "Configure a mixed instances policy with an On-Demand base capacity of four and Spot Instances for capacity above it.",
  "Set the Spot allocation strategy to price-capacity-optimized and offer several instance types across all AZs.",
  "Run every instance as Spot through a persistent request in one Availability Zone.",
  "Run the whole group On-Demand and cover it with a Compute Savings Plan.",
]
answer = ["B", "C"]
explain = { A = "Lowest-price is not recommended because it picks the cheapest pools, which carry the highest interruption risk, and a single type narrows the choice further.", B = "Correct. An On-Demand base keeps the four required instances running, and the Spot discount applies to everything above it.", C = "Correct. Price-capacity-optimized weighs both price and available capacity, and many types and AZs give it more Spot pools to choose from.", D = "All-Spot in one zone gives no guaranteed base of four and little pool diversity.", E = "It meets the availability rule, but it pays more than Spot for the interruptible portion of the fleet." }
ref = "week_03_compute_and_scaling/concepts/02_purchasing_options.md"

[[question]]
id = "w03-q28"
domain = 4
task = "4.2"
services = ["Amazon EC2", "Dedicated Hosts"]
kind = "single"
stem = """A software company must run a database that is licensed per physical core. The vendor's audit requires the company to report the number of sockets and cores the workload runs on and to keep the VM on the same physical server over time. Which EC2 option meets these requirements?"""
options = [
  "Dedicated Instances in a VPC with dedicated tenancy.",
  "Shared-tenancy On-Demand Instances covered by a Compute Savings Plan.",
  "Dedicated Hosts with host affinity.",
  "Zonal Reserved Instances for the chosen instance type.",
]
answer = ["C"]
explain = { A = "Dedicated Instances run on single-tenant hardware, but they give no visibility of sockets and cores and no host affinity.", B = "Shared tenancy gives no view of the physical server at all.", C = "Correct. A Dedicated Host is a whole physical server that shows sockets and cores and supports host affinity, which is what per-core BYOL licensing audits need.", D = "A zonal RI reserves capacity and a discount, but the instance still runs on shared hardware." }
ref = "week_03_compute_and_scaling/concepts/02_purchasing_options.md"

[[question]]
id = "w03-q29"
domain = 4
task = "4.2"
services = ["Amazon EC2", "On-Demand Capacity Reservations"]
kind = "single"
stem = """A retailer runs a two-week promotional event and needs 40 c7i.xlarge instances guaranteed to launch in us-east-1a on the first day. After the event the instances are not needed, and the company does not want a long commitment. What is the MOST cost-effective way to guarantee the capacity?"""
options = [
  "Buy a one-year Compute Savings Plan for the instances.",
  "Buy 40 one-year zonal Reserved Instances in us-east-1a for the event.",
  "Request Spot Instances with a persistent request.",
  "Create an On-Demand Capacity Reservation in us-east-1a, then cancel it.",
]
answer = ["D"]
explain = { A = "A Savings Plan discounts usage but does not reserve any capacity.", B = "It guarantees capacity, but the one-year term commits the company to pay for 40 instances for a year, far beyond the event.", C = "Spot capacity can be interrupted or unavailable, so nothing is guaranteed.", D = "Correct. A Capacity Reservation reserves capacity in a specific AZ for any duration with no term, so it can be created now and cancelled when the event ends." }
ref = "week_03_compute_and_scaling/concepts/02_purchasing_options.md"

[[question]]
id = "w03-q30"
domain = 4
task = "4.2"
services = ["Amazon EC2 Auto Scaling", "AWS Graviton"]
kind = "single"
stem = """A development team runs 20 m7i.large Linux build instances in an Auto Scaling group. They sit idle from 8 p.m. to 7 a.m. and on weekends. The builds also run on Arm. The company wants to cut this fleet's cost as far as possible without hurting daytime work. Which approach is the MOST cost-effective?"""
options = [
  "Move the group to m7g.large instances and keep all of them running around the clock.",
  "Move to m7g.large instances and scale the group to zero when idle on a schedule.",
  "Buy three-year Standard Reserved Instances for the 20 m7i.large instances.",
  "Move the group to 10 m7i.xlarge instances and keep it running around the clock.",
]
answer = ["B"]
explain = { A = "It lowers the hourly rate, but the fleet still pays for the idle nights and weekends.", B = "Correct. Graviton instances cost less than comparable x86 ones, and scaling to zero while the fleet is idle removes the largest share of the bill.", C = "A three-year commitment discounts the instances but still pays for them around the clock, idle or not.", D = "Two m7i.large equal one m7i.xlarge in capacity, so this changes nothing and still runs all the time." }
ref = "week_03_compute_and_scaling/concepts/02_purchasing_options.md"
