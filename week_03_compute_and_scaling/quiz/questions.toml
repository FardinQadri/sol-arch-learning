choose = 2
stem = """A SaaS company serves www.alpha.example and www.beta.example from the same account. Each domain has its own target group. The company wants a single internet-facing ALB to terminate HTTPS for both domains, each with its own certificate. Which combination of steps meets these requirements? (Select TWO.)"""
options = [
  "Create path-pattern rules that match each domain name.",
  "Create host-header rules on the HTTPS listener that forward each domain to its own target group.",
  "Create a second ALB for the second domain in the same subnets.",
  "Add a certificate for each domain to the HTTPS listener and rely on SNI.",
  "Place a Network Load Balancer with one TCP listener per domain in front of the ALB.",
