  "Standard-IA at day 30, Glacier Deep Archive at day 90, expire at day 365.",
  "Glacier Flexible Retrieval at day 90, expire at day 365, with the logs in S3 Standard until then.",
]
answer = ["A"]
explain = { A = "Correct. Standard-IA covers the occasional millisecond reads, and Glacier Flexible Retrieval restores in 3 to 5 hours with Standard retrievals, matching the audit requirement at a low price.", B = "Moving to Flexible Retrieval at day 30 removes millisecond access for the logs that engineers still look at between days 30 and 90.", C = "Deep Archive Standard retrievals take up to 12 hours, which misses the 5-hour requirement.", D = "This works, but keeping the logs in Standard for 90 days costs more than moving them to Standard-IA at day 30." }
