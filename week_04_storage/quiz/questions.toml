domain = 1
task = "1.3"
services = ["Amazon S3", "S3 Object Lock"]
kind = "single"
stem = """A company must store contract files so that ordinary users and developers cannot modify or delete them for one year. A small group of security administrators must still be able to shorten or remove the retention when a legal ruling allows it. The protection has to be write-once-read-many, enforced by S3 itself. Which configuration meets these requirements?"""
