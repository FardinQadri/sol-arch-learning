domain = 4
task = "4.1"
services = ["Amazon S3", "S3 One Zone-IA"]
kind = "single"
stem = """An e-commerce company generates a 400 KB thumbnail for every product image and stores it in S3. A job can regenerate any thumbnail from the original image in under a minute, so losing a thumbnail is only an inconvenience. Each thumbnail is read a few times a month for about two months and is then deleted. Reads must return in milliseconds. Which storage choice is the MOST cost-effective?"""
options = [
  "Store the thumbnails in S3 Standard.",
  "Store the thumbnails in S3 Standard-IA.",
  "Store the thumbnails in S3 One Zone-IA.",
  "Store the thumbnails in S3 Intelligent-Tiering.",
]
answer = ["C"]
explain = { A = "This works, but Standard costs 0.023 USD per GB-month, more than double the One Zone-IA price for data read only a few times a month.", B = "Standard-IA works, but it pays for three-AZ resilience at 0.0125 USD per GB-month that re-creatable data does not need.", C = "Correct. One Zone-IA costs 0.01 USD per GB-month and gives millisecond access. Its single-AZ storage is acceptable because the thumbnails can be regenerated.", D = "Intelligent-Tiering charges a monitoring fee per object and keeps new objects at the Standard price for their first 30 days, so it costs more here." }
ref = "week_04_storage/concepts/01_s3_fundamentals_and_classes.md"

