domain = 4
task = "4.1"
services = ["Amazon S3", "S3 Lifecycle"]
kind = "single"
stem = """A SaaS company writes 2 TB of application logs to S3 every month. Engineers read the logs daily for the first 30 days. For the next 60 days they sometimes look at old logs and need them in milliseconds. After that, only auditors read them, and a retrieval time of up to 5 hours is fine. The logs can be deleted after 365 days. Which lifecycle configuration has the lowest cost and meets these needs?"""
