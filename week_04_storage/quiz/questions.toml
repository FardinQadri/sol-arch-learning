[[question]]
id = "w04-q10"
domain = 4
task = "4.1"
services = ["Amazon S3", "S3 Versioning", "S3 Lifecycle"]
kind = "single"
stem = """A law firm turned on versioning for the bucket that holds its working documents, and the storage bill has quadrupled because every edit leaves a full copy behind. Staff must still be able to restore any of the three most recent previous versions of a document quickly. Older versions are never needed. What is the MOST cost-effective change?"""
options = [
  "Add a lifecycle rule that expires current versions 3 days after their last modification.",
  "Suspend versioning and delete the old versions by hand every 3 months.",
  "Add a lifecycle rule that expires noncurrent versions, keeping the 3 newest ones.",
  "Add a lifecycle rule that moves noncurrent versions to S3 Standard-IA after 30 days.",
]
answer = ["C"]
explain = { A = "Expiring current versions deletes the live documents, not the old copies that drive the cost.", B = "Suspending versioning removes the ability to restore recent versions, and the hand deletion is manual work that keeps cost in place until it happens.", C = "Correct. NoncurrentVersionExpiration with NewerNoncurrentVersions keeps the three newest noncurrent versions and permanently deletes older ones, so the growth stops.", D = "This keeps working, but it keeps every old version forever at a lower rate, so the total still grows." }
ref = "week_04_storage/concepts/02_s3_lifecycle_versioning_replication.md"

[[question]]
id = "w04-q11"
domain = 1
task = "1.3"
services = ["Amazon S3", "S3 Versioning"]
kind = "single"
stem = """A user deleted quarterly-report.pdf from a bucket that has versioning enabled. The delete was a plain DELETE request with no version ID, and the object no longer appears in listings. The user needs the same file back, with the least effort and without uploading anything again. What should the administrator do?"""
options = [
  "Request a restore of the object from S3 Glacier.",
  "Permanently delete the delete marker by specifying its version ID.",
  "Suspend versioning on the bucket and list the object again.",
  "Replicate the object from a backup bucket created today.",
]
answer = ["B"]
explain = { A = "Glacier restores apply to archived storage classes, and nothing here was archived.", B = "Correct. A plain delete in a versioned bucket only adds a delete marker. Deleting that marker with its version ID makes the previous version current again.", C = "Suspending versioning does not remove the existing delete marker, so the object stays hidden.", D = "There is no backup bucket holding the file, and replication copies only new changes, so this cannot return the object." }
ref = "week_04_storage/concepts/02_s3_lifecycle_versioning_replication.md"

[[question]]
id = "w04-q12"
domain = 1
task = "1.3"
services = ["Amazon S3", "S3 Object Lock"]
kind = "single"
stem = """A broker-dealer must keep trade confirmations in a state where no one can change or delete them for six years. Regulators require that this holds even for the account root user and for administrators with full S3 permissions. The records live in a single bucket. Which solution meets the requirement?"""
options = [
