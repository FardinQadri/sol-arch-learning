task = "4.1"
services = ["Amazon S3", "S3 Lifecycle", "S3 Standard-IA"]
kind = "single"
stem = """A finance team uploads daily export files of about 50 MB directly into S3 Standard-IA by setting the storage class on each PUT, and a lifecycle rule deletes each file on day 10. The files are read often during their short life, and the bill shows 30 days of Standard-IA storage for every file. The team wants the lowest cost for these short-lived files. What change should the architect make?"""
options = [
  "Upload the files to S3 Standard and keep the delete rule on day 10.",
  "Upload the files to S3 One Zone-IA and keep the delete rule on day 10.",
  "Upload the files to S3 Glacier Instant Retrieval and keep the delete rule on day 10.",
  "Keep uploading to Standard-IA and move the delete rule to day 30.",
]
answer = ["A"]
explain = { A = "Correct. Standard-IA bills a 30-day minimum, so deleting on day 10 still pays for 30 days. Standard has no minimum duration, so 10 days of storage cost less.", B = "One Zone-IA also has a 30-day minimum duration, so the early-delete charge remains.", C = "Glacier Instant Retrieval has a 90-day minimum duration, which makes the early-delete charge larger.", D = "The files still pay Standard-IA retrieval fees for frequent reads and are kept 20 days longer for nothing." }
ref = "week_04_storage/concepts/01_s3_fundamentals_and_classes.md"

