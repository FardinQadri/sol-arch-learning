  "Store the studies in S3 Glacier Deep Archive and use Standard restores.",
]
answer = ["B"]
explain = { A = "This works, but Standard-IA costs 0.0125 USD per GB-month against 0.004 for Glacier Instant Retrieval, and a quarterly read does not offset that gap.", B = "Correct. Glacier Instant Retrieval is built for data read about once a quarter with millisecond access, and its storage price is the lowest of the classes that serve reads immediately.", C = "Expedited restores usually take 1 to 5 minutes, not milliseconds, and each restore is a separate request.", D = "Standard restores from Deep Archive take up to 12 hours." }
