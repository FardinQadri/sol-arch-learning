services = ["Amazon S3", "AWS KMS", "S3 Bucket Keys"]
kind = "single"
stem = """A bank encrypts a busy S3 bucket with SSE-KMS using a customer managed key. Security requires that key policies and CloudTrail records for the KMS key stay in place. The bucket serves billions of requests a month, and the KMS request charges are now a large part of the bill. How can the architect cut the KMS cost the MOST while keeping the key control?"""
