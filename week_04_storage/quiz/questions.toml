services = ["Amazon S3", "S3 Standard-IA"]
kind = "single"
stem = """An IoT company stores 300 million sensor readings as separate 20 KB objects. Each object is read a few times a month, always in milliseconds. An engineer proposes lifecycle rules that move the objects to an infrequent-access class after 30 days to cut the storage bill. Which approach lowers the monthly cost?"""
options = [
