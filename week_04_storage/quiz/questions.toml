[[question]]
id = "w04-q16"
domain = 2
task = "2.2"
services = ["Amazon S3", "S3 Replication Time Control"]
kind = "single"
stem = """A payments company replicates objects from a bucket in us-east-1 to a bucket in us-west-2. Its compliance team requires that new objects appear in the destination within 15 minutes, backed by a service-level commitment, and wants replication metrics to prove it. Which solution meets the requirement?"""
options = [
  "Run S3 Batch Replication jobs on a 15-minute schedule.",
  "Enable S3 Replication Time Control on the replication rule.",
  "Enable Transfer Acceleration on the destination bucket.",
  "Add a second replication rule with replica modification sync enabled.",
]
answer = ["B"]
