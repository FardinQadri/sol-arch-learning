stem = """A company has twelve AWS accounts in us-east-1, and each writes application logs to its own S3 bucket. A data-sovereignty rule keeps all data in us-east-1. The security team wants a copy of every new log object in a bucket owned by a central log-archive account, with no scripts to maintain and no inter-Region data transfer charges. Which solution should the architect use?"""
