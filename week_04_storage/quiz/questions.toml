services = ["Amazon S3", "S3 Glacier Instant Retrieval"]
kind = "single"
stem = """A hospital network stores 200 TB of imaging studies that it must keep for many years. Each study is opened about once per quarter, usually for a patient follow-up, and the radiologist expects it to appear in milliseconds. The hospital wants the lowest storage cost that still meets the access requirement. Which design should the architect choose?"""
