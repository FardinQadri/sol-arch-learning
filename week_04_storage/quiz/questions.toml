[[question]]
id = "w04-q17"
domain = 2
task = "2.2"
services = ["Amazon S3", "S3 Batch Replication"]
kind = "single"
stem = """A company turned on cross-Region replication for a bucket that already holds 80 TB of objects. New uploads now replicate, but the objects uploaded before the rule existed are missing from the destination Region. The company needs those older objects copied as well, with the least manual effort. What should the architect do?"""
options = [
  "Suspend versioning on the source bucket and enable it again.",
