kind = "single"
stem = """A genomics lab archived 300 TB of sequencing data in S3 Glacier Flexible Retrieval. A one-time analysis needs all of it back, and the team can wait a day for the data to arrive. Nobody needs a faster restore, and the lab wants to pay as little as possible for the retrieval. How should the architect restore the objects?"""
