[[question]]
id = "w04-q06"
domain = 4
task = "4.1"
services = ["Amazon S3", "S3 Intelligent-Tiering"]
kind = "single"
stem = """A data-analytics company stores 500 TB of 5 MB result files in S3. Some datasets are read daily for weeks and then sit idle for months, and others become popular again without warning, so the team cannot predict which files will be hot. The company wants storage costs to fall for idle data, no retrieval fees when an old file is suddenly needed, and no ongoing lifecycle tuning. What should the architect do?"""
options = [
  "Add a lifecycle rule that moves all files to S3 Standard-IA after 30 days.",
  "Store the files in S3 Intelligent-Tiering.",
  "Add a lifecycle rule that moves all files to S3 Glacier Instant Retrieval after 30 days.",
  "Keep the files in S3 Standard and review access reports each quarter.",
]
answer = ["B"]
explain = { A = "Standard-IA charges 0.01 USD per GB each time a file is read, so datasets that become hot again incur retrieval fees.", B = "Correct. Intelligent-Tiering moves each object between access tiers on its own and charges no retrieval fees, so unpredictable access needs no tuning.", C = "Glacier Instant Retrieval charges 0.03 USD per GB retrieved, so files that suddenly become popular again become expensive to read.", D = "This works, but Standard never lowers the price of idle data and the quarterly review is manual effort the company wants to avoid." }
ref = "week_04_storage/concepts/01_s3_fundamentals_and_classes.md"

[[question]]
