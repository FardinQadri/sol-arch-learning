ref = "week_04_storage/concepts/02_s3_lifecycle_versioning_replication.md"

[[question]]
id = "w04-q14"
domain = 4
task = "4.1"
services = ["Amazon S3", "S3 Lifecycle", "Multipart upload"]
kind = "single"
stem = """A video platform uploads 100 GB files to S3 with multipart upload, and many uploads fail halfway when users close their browsers. The S3 storage bill keeps growing, yet listing the bucket shows no extra objects. The company wants to stop paying for the leftover data without changing the upload application. What should the architect do?"""
options = [
  "Add a lifecycle rule that expires objects 7 days after creation.",
  "Add a lifecycle rule that moves objects to Glacier Flexible Retrieval after 7 days.",
  "Add a lifecycle rule that aborts incomplete multipart uploads after 7 days.",
  "Enable versioning and expire noncurrent versions after 7 days.",
]
answer = ["C"]
explain = { A = "Object expiration rules do not remove incomplete multipart uploads, so the stored parts keep billing.", B = "Parts of an unfinished upload are not objects yet, so a transition rule does not apply to them.", C = "Correct. Parts of an unfinished multipart upload are billed until completed or aborted, and AbortIncompleteMultipartUpload removes them after the set number of days.", D = "Versioning applies to completed objects, and it would add copies rather than remove orphaned parts." }
ref = "week_04_storage/concepts/02_s3_lifecycle_versioning_replication.md"

