[[question]]
id = "w04-q01"
domain = 4
task = "4.1"
services = ["Amazon S3", "S3 Standard-IA"]
kind = "single"
stem = """A media company keeps 40 TB of finished video projects in S3 Standard. After the first month each project is opened about once a month, and an editor who opens one expects it to load in milliseconds. The data must stay resilient to the loss of an Availability Zone, and the company wants the lowest storage cost that still meets these needs. What should the architect do?"""
options = [
  "Leave the projects in S3 Standard and add no lifecycle rule.",
  "Transition the projects to S3 One Zone-IA after 30 days.",
  "Transition the projects to S3 Glacier Flexible Retrieval after 30 days.",
  "Transition the projects to S3 Standard-IA after 30 days.",
]
answer = ["D"]
explain = { A = "This works, but Standard costs 0.023 USD per GB-month against 0.0125 for Standard-IA, so it is the more expensive way to hold data read once a month.", B = "One Zone-IA stores data in a single Availability Zone, so it does not survive the loss of that zone.", C = "Glacier Flexible Retrieval objects must be restored first, which takes minutes to hours, not milliseconds.", D = "Correct. Standard-IA keeps millisecond access across three or more AZs at a lower storage price, and a monthly read pays only a small per-GB retrieval fee." }
ref = "week_04_storage/concepts/01_s3_fundamentals_and_classes.md"

