[[question]]
id = "w04-q22"
domain = 1
task = "1.3"
services = ["Amazon S3", "Presigned URLs"]
kind = "single"
stem = """A customer portal stores invoices as private objects in S3. A customer who has no AWS account must be able to download one specific invoice, but only for the next 15 minutes. The company does not want to run a proxy server for downloads. Which solution should the architect use?"""
options = [
  "Make the invoice object public and delete it after 15 minutes.",
  "Generate a presigned URL for the object that expires in 15 minutes.",
  "Create a temporary IAM user for the customer and delete it after 15 minutes.",
  "Add a bucket policy that allows the customer's IP address for 15 minutes.",
]
answer = ["B"]
explain = { A = "Making the object public exposes it to everyone until it is deleted, and the company cannot guarantee it will be removed on time.", B = "Correct. A presigned URL grants temporary access to one private object using the permissions of the principal that signed it, and stops working at expiry.", C = "Creating an IAM user for a customer is heavy access management that gives the customer broader credentials than one download needs.", D = "The customer's IP address is not known or stable, and the policy needs manual cleanup to stop allowing it." }
ref = "week_04_storage/concepts/03_s3_security.md"

[[question]]
id = "w04-q23"
domain = 1
task = "1.3"
services = ["Amazon S3", "Amazon CloudFront"]
kind = "multi"
choose = 2
stem = """A marketing company serves website assets from a private S3 bucket through an Amazon CloudFront distribution. Viewers must reach the objects only through CloudFront, and requests sent directly to the S3 URL must be denied. Which TWO steps meet these requirements? (Select TWO.)"""
options = [
  "Create a CloudFront origin access control and attach it to the S3 origin.",
  "Add a bucket policy that allows the CloudFront service principal only for requests from this distribution.",
  "Enable static website hosting and use the website endpoint as the origin.",
  "Turn off Block Public Access and grant public read on the bucket.",
  "Enable Transfer Acceleration on the bucket and use its endpoint as the origin.",
]
answer = ["A", "B"]
explain = { A = "Correct. Origin access control makes CloudFront sign its requests to the S3 origin.", B = "Correct. The bucket policy lets cloudfront.amazonaws.com read objects only when AWS:SourceArn matches the distribution, so direct S3 requests are denied.", C = "A website endpoint cannot use origin access control, and it serves content publicly.", D = "Public read lets anyone fetch objects straight from S3, which is the opposite of the requirement.", E = "Transfer Acceleration speeds client uploads and does not restrict who can read objects." }
ref = "week_04_storage/concepts/03_s3_security.md"

[[question]]
id = "w04-q24"
domain = 3
task = "3.1"
services = ["Amazon S3", "Multipart upload"]
kind = "single"
stem = """A film studio uploads 5 GB video files from its office to an S3 bucket in the nearest Region over a fast, reliable 1 Gbps link. Uploading each file as a single request is slow, and a dropped connection near the end forces a full restart. The studio wants faster uploads and recovery of only the failed portion. What should the architect do?"""
options = [
  "Upload each file with a single PUT request over several parallel connections.",
  "Enable Transfer Acceleration and upload each file with a single PUT request.",
  "Use multipart upload with 100 MB parts sent in parallel.",
  "Upload each file through the S3 console one at a time.",
]
answer = ["C"]
explain = { A = "A single PUT sends the object as one request, so parallel connections do not help it and a failure still restarts the whole file.", B = "Acceleration helps long-distance paths, and the bucket is in the nearest Region, so it adds cost without fixing the restart problem.", C = "Correct. Multipart upload splits the file into parts uploaded in parallel and retries only a failed part, which also raises throughput on a fast link.", D = "The console still sends the file as a single stream per upload, and nothing here gives parallel parts or partial retry." }
ref = "week_04_storage/concepts/05_fsx_gateway_and_choosing.md"

[[question]]
id = "w04-q25"
domain = 3
task = "3.1"
services = ["Amazon S3", "S3 Transfer Acceleration"]
kind = "single"
stem = """A photography site lets users in Asia, Europe and South America upload 2 GB RAW files into one bucket in us-east-1. Uploads from far away are slow and unstable. The company wants faster uploads from every continent while keeping a single bucket and not running any servers. What should the architect do?"""
options = [
  "Enable S3 Transfer Acceleration on the bucket and use the accelerate endpoint.",
  "Create a bucket in each Region and replicate every bucket to a central bucket.",
  "Increase the multipart part size to 5 GB.",
  "Spread the uploads across ten key prefixes.",
]
answer = ["A"]
explain = { A = "Correct. Transfer Acceleration routes uploads to the nearest CloudFront edge location and then over the AWS network to the bucket, which speeds long-distance transfers.", B = "This works for uploads, but it needs a bucket and replication per Region, which breaks the single-bucket requirement and costs more.", C = "A larger part size does not shorten the distance and makes retries heavier.", D = "Prefixes raise request-rate limits and do nothing for network distance." }
ref = "week_04_storage/concepts/05_fsx_gateway_and_choosing.md"

[[question]]
id = "w04-q26"
domain = 3
task = "3.1"
services = ["Amazon S3", "S3 request rates"]
kind = "single"
stem = """A log-analysis application reads about 20,000 small objects per second from an S3 general purpose bucket. All the objects share a single key prefix, and the application receives 503 Slow Down responses at peak. What should the architect do to remove the errors?"""
options = [
  "Add a random suffix to the end of each object key under the same prefix.",
  "Open a support case to raise the bucket's request limit.",
  "Enable Transfer Acceleration for the application.",
  "Spread the objects across several prefixes and read them in parallel.",
]
answer = ["D"]
explain = { A = "The prefix stays the same, so the per-prefix request limit is unchanged.", B = "S3 scales per prefix, and the limit is not raised by a support case for a single bucket.", C = "Transfer Acceleration speeds long-distance transfers and does not raise the request rate of a prefix.", D = "Correct. Each prefix supports at least 5,500 GET/HEAD requests per second, so four or more prefixes cover 20,000 per second." }
ref = "week_04_storage/concepts/05_fsx_gateway_and_choosing.md"

[[question]]
id = "w04-q27"
domain = 4
task = "4.1"
services = ["Amazon EBS", "gp3", "gp2"]
kind = "single"
stem = """A company runs a database on a 2,000 GiB gp2 volume. At 3 IOPS per GiB the volume delivers 6,000 IOPS, which the workload needs, and throughput is not a problem. The company wants to keep that performance while lowering the cost of the volume, without detaching it. Which change is the MOST cost-effective?"""
options = [
  "Increase the gp2 volume to 3,000 GiB for more baseline IOPS.",
  "Modify the volume to gp3 and provision 6,000 IOPS.",
  "Modify the volume to io2 and provision 6,000 IOPS.",
  "Modify the volume to st1 and keep the same size.",
]
answer = ["B"]
explain = { A = "This works, but a larger gp2 volume costs 0.10 USD per GB-month and adds 1,000 GiB the workload does not need.", B = "Correct. A gp3 volume includes 3,000 IOPS and charges a small amount for the extra 3,000, and its storage costs 20 percent less per GB than gp2. The change can be made in place.", C = "io2 works, but its IOPS are priced at 0.065 USD per provisioned IOPS-month, which costs far more than gp3.", D = "st1 is a throughput-optimized HDD with a maximum of 500 IOPS, so it cannot deliver 6,000 IOPS." }
ref = "week_04_storage/concepts/04_ebs_instance_store_efs.md"

[[question]]
id = "w04-q28"
domain = 3
task = "3.1"
services = ["Amazon EBS", "EBS Multi-Attach", "Amazon EC2"]
kind = "multi"
choose = 2
stem = """A company runs a clustered application on three Nitro-based EC2 instances in a single Availability Zone. All three instances must read and write the same block volume at the same time. Which TWO actions meet this requirement? (Select TWO.)"""
options = [
  "Create an io2 volume with Multi-Attach enabled and attach it to the instances.",
  "Format the volume with a cluster-aware file system, or let the application coordinate writes.",
  "Create a gp3 volume with Multi-Attach enabled and attach it to the instances.",
  "Format the volume with XFS and mount it read-write on all three instances.",
  "Place the three instances in different Availability Zones and attach one volume.",
]
answer = ["A", "B"]
explain = { A = "Correct. Multi-Attach is available only for Provisioned IOPS SSD volumes, io1 and io2, and attaches one volume to up to 16 Nitro instances in the same AZ.", B = "Correct. Multi-Attach gives no write ordering. A cluster-aware file system, or the application itself, must coordinate writes to avoid corruption.", C = "gp3 volumes do not support Multi-Attach.", D = "XFS is not cluster-aware, so concurrent read-write mounts risk corrupting the file system.", E = "A volume attaches only to instances in its own Availability Zone, including with Multi-Attach." }
ref = "week_04_storage/concepts/04_ebs_instance_store_efs.md"

[[question]]
id = "w04-q29"
domain = 3
task = "3.1"
services = ["Amazon EFS", "Amazon EC2"]
kind = "single"
stem = """A publishing company runs Linux web servers in three Availability Zones behind a load balancer. Every server must read and write the same uploaded media files through a shared POSIX file system. The storage must grow and shrink on its own, and the company does not want to manage capacity. Which storage solution should the architect choose?"""
options = [
  "An io2 volume with Multi-Attach, attached to every server.",
  "Amazon FSx for Windows File Server with an SMB share.",
  "A Regional Amazon EFS file system with a mount target in each Availability Zone.",
  "Instance store volumes on every server, synchronized with rsync.",
]
answer = ["C"]
explain = { A = "An EBS volume, even with Multi-Attach, attaches only within one Availability Zone, so it cannot serve three zones.", B = "FSx for Windows File Server uses SMB with Windows permissions and is not a POSIX file system for Linux servers.", C = "Correct. EFS is a shared NFS file system for Linux that spans Availability Zones, grows and shrinks automatically, and is mounted through a mount target in each zone.", D = "Instance store data is local and temporary, and rsync gives no shared view of the files." }
ref = "week_04_storage/concepts/04_ebs_instance_store_efs.md"

[[question]]
id = "w04-q30"
domain = 3
task = "3.1"
services = ["AWS Storage Gateway", "S3 File Gateway", "Amazon S3"]
kind = "single"
stem = """A manufacturer's factory has on-premises Windows and Linux applications that read and write files on network shares over SMB and NFS. The company wants the files stored durably in S3 while the applications keep using the shares unchanged, and recently used files must open quickly from a cache on site. Which solution should the architect deploy?"""
options = [
  "An S3 File Gateway virtual appliance in the factory data center.",
  "A Volume Gateway with cached volumes presented over iSCSI.",
  "Amazon FSx for Windows File Server reached over AWS Direct Connect.",
  "A nightly AWS DataSync task that copies the shares to S3.",
]
answer = ["A"]
explain = { A = "Correct. S3 File Gateway exposes NFS and SMB shares on site, stores each file as an S3 object, and keeps recently used data in a local cache.", B = "Volume Gateway presents block volumes over iSCSI, not file shares, and the applications expect shares.", C = "FSx for Windows File Server holds data in FSx and not in S3, and it has no local cache in the factory.", D = "DataSync copies data on a schedule and does not provide a share that applications can keep using, nor a local cache." }
ref = "week_04_storage/concepts/05_fsx_gateway_and_choosing.md"
